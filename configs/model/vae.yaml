# VAE model configuration
_target_: src.models.vae.HandwritingVAE

# Encoder architecture
encoder:
  input_channels: 1
  latent_dim: 128
  hidden_dims: [32, 64, 128, 256]
  use_spectral_norm: false

# Decoder architecture
decoder:
  latent_dim: 128
  text_embedding_dim: 256
  hidden_dims: [256, 128, 64, 32]
  output_channels: 1

# Loss configuration
loss:
  beta: 1.0  # beta-VAE parameter
  reconstruction_loss: "mse"  # mse, bce, l1
  kl_weight: 1.0
  use_annealing: true
  annealing_steps: 10000

# Training specific
lr: 0.001
beta1: 0.9
beta2: 0.999
weight_decay: 1e-5
