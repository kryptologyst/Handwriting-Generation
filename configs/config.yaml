# Default configuration for handwriting generation
defaults:
  - _self_
  - model: gan
  - data: synthetic
  - training: default
  - evaluation: default

# Global settings
seed: 42
device: auto  # auto, cpu, cuda, mps
precision: 16-mixed  # 32, 16-mixed, bf16-mixed
num_workers: 4
pin_memory: true

# Paths
data_dir: data/
output_dir: outputs/
checkpoint_dir: checkpoints/
log_dir: logs/
assets_dir: assets/

# Training
batch_size: 32
max_epochs: 100
learning_rate: 0.0002
beta1: 0.5
beta2: 0.999
weight_decay: 0.0

# Sampling
num_samples: 16
sample_steps: 50
guidance_scale: 7.5
temperature: 1.0

# Logging
log_every_n_steps: 50
save_every_n_epochs: 10
validate_every_n_epochs: 5

# Wandb
use_wandb: false
wandb_project: handwriting-generation
wandb_entity: null
